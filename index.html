<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WeatherWise</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ AI WeatherWise</h1>
        <p class="subtitle">Smart Weather Information System</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button onclick="getWeather()">Search</button>
        </div>

        <div id="weatherBox" class="weather-box">

            <h2 id="cityName">Weather Information</h2>

            <div class="weather-icon" id="weatherIcon">🌤️</div>

            <h3 id="temperature">-- °C</h3>
            <p id="description">Search for a city</p>

            <div class="details">

                <div class="detail-card">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">-- %</strong>
                </div>

                <div class="detail-card">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind">-- m/s</strong>
                </div>

                <div class="detail-card">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">-- °C</strong>
                </div>

            </div>

            <div class="ai-box">
                <h3>🤖 AI WeatherWise Suggestion</h3>
                <p id="suggestion">
                    Enter a city to get a weather suggestion.
                </p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
