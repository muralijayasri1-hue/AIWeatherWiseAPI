<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI WeatherWise</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🌤️ AI WeatherWise</h1>
            <p>Smart Weather Information System</p>
        </div>

        <div class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>

        </div>

        <div class="weather-box">

            <h2 id="cityName">Weather Information</h2>

            <div id="weatherIcon" class="weather-icon">
                🌤️
            </div>

            <h3 id="temperature">
                -- °C
            </h3>

            <p id="description">
                Search for a city to get weather information
            </p>

            <div class="weather-details">

                <div class="card">
                    <h4>💧 Humidity</h4>
                    <p id="humidity">-- %</p>
                </div>

                <div class="card">
                    <h4>💨 Wind</h4>
                    <p id="wind">-- m/s</p>
                </div>

                <div class="card">
                    <h4>🌡️ Feels Like</h4>
                    <p id="feelsLike">-- °C</p>
                </div>

            </div>

            <div class="ai-suggestion">

                <h3>🤖 AI WeatherWise Suggestion</h3>

                <p id="suggestion">
                    Enter a city name to receive a smart weather suggestion.
                </p>

            </div>

        </div>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
